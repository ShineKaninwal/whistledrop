<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>WhistleDrop · Moderator console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f5b800' d='M16 2C16 2 6 13 6 20a10 10 0 0020 0C26 13 16 2 16 2z'/%3E%3Ccircle cx='16' cy='20' r='3.5' fill='%2314213d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- Sign in -->
  <main id="login-view" class="login" hidden>
    <section class="login-panel" aria-labelledby="login-title">
      <div class="brand brand-large">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path class="mark-drop" d="M16 2C16 2 6 13 6 20a10 10 0 0020 0C26 13 16 2 16 2z"/><circle class="mark-pea" cx="16" cy="20" r="3.5"/></svg>
        <span class="wordmark">WhistleDrop</span>
      </div>
      <h1 id="login-title">Moderator sign-in</h1>
      <p class="muted">Reports are anonymous and sensitive. Sign in only on a device you trust.</p>
      <form id="login-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="btn btn-primary btn-block" type="submit" id="login-submit">Sign in</button>
      </form>
    </section>
  </main>

  <!-- Console -->
  <div id="console-view" hidden>
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path class="mark-drop" d="M16 2C16 2 6 13 6 20a10 10 0 0020 0C26 13 16 2 16 2z"/><circle class="mark-pea" cx="16" cy="20" r="3.5"/></svg>
        <span class="wordmark">WhistleDrop</span>
        <span class="brand-sub">Moderator console</span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="theme-toggle" type="button" aria-label="Switch colour theme">Theme</button>
        <button class="btn" id="logout" type="button">Log out</button>
      </div>
    </header>

    <main class="shell">
      <section class="ledger" aria-label="Report totals">
        <button class="ledger-cell" type="button" data-status="" aria-pressed="true">
          <span class="ledger-num" id="stat-total">–</span><span class="ledger-label">Total reports</span>
        </button>
        <button class="ledger-cell" type="button" data-status="SUBMITTED" aria-pressed="false">
          <span class="ledger-num" id="stat-submitted">–</span><span class="ledger-label">Submitted</span>
        </button>
        <button class="ledger-cell" type="button" data-status="UNDER_REVIEW" aria-pressed="false">
          <span class="ledger-num" id="stat-under_review">–</span><span class="ledger-label">Under review</span>
        </button>
        <button class="ledger-cell" type="button" data-status="RESOLVED" aria-pressed="false">
          <span class="ledger-num" id="stat-resolved">–</span><span class="ledger-label">Resolved</span>
        </button>
        <button class="ledger-cell" type="button" data-status="DISMISSED" aria-pressed="false">
          <span class="ledger-num" id="stat-dismissed">–</span><span class="ledger-label">Dismissed</span>
        </button>
      </section>

      <section class="panel" aria-label="Reports">
        <div class="toolbar">
          <input id="search" type="search" placeholder="Search case code or description" aria-label="Search reports">
          <select id="filter-category" aria-label="Filter by category">
            <option value="">All categories</option>
            <option value="SECURITY">Security</option>
            <option value="HARASSMENT">Harassment</option>
            <option value="CORRUPTION">Corruption</option>
            <option value="TECHNICAL">Technical</option>
            <option value="OTHER">Other</option>
          </select>
          <select id="filter-status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="SUBMITTED">Submitted</option>
            <option value="UNDER_REVIEW">Under review</option>
            <option value="RESOLVED">Resolved</option>
            <option value="DISMISSED">Dismissed</option>
          </select>
          <button class="btn" id="refresh" type="button">Refresh</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">Case code</th>
                <th scope="col">Category</th>
                <th scope="col">Status</th>
                <th scope="col">Created</th>
                <th scope="col">Updated</th>
                <th scope="col"><span class="visually-hidden">Action</span></th>
              </tr>
            </thead>
            <tbody id="report-rows"></tbody>
          </table>
        </div>

        <div class="pager">
          <span id="page-info" class="muted" aria-live="polite"></span>
          <div class="pager-buttons">
            <button class="btn" id="prev" type="button">Previous</button>
            <button class="btn" id="next" type="button">Next</button>
          </div>
        </div>
      </section>
    </main>

    <!-- Report detail drawer -->
    <div id="backdrop" class="backdrop" hidden></div>
    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-code" hidden>
      <div class="drawer-head">
        <div>
          <p class="muted drawer-kicker">Report</p>
          <h2 id="drawer-code" class="code-large"></h2>
        </div>
        <button class="btn btn-ghost" id="drawer-close" type="button" aria-label="Close report">Close</button>
      </div>

      <div class="drawer-body">
        <dl class="facts">
          <div><dt>Category</dt><dd id="d-category"></dd></div>
          <div><dt>Status</dt><dd id="d-status"></dd></div>
          <div><dt>Created</dt><dd id="d-created"></dd></div>
          <div><dt>Updated</dt><dd id="d-updated"></dd></div>
        </dl>

        <h3>Description</h3>
        <p id="d-description" class="description"></p>

        <h3>Evidence</h3>
        <p id="d-evidence"></p>

        <form id="status-form" class="status-form" novalidate>
          <h3>Update this report</h3>
          <label for="f-status">Status</label>
          <select id="f-status"></select>
          <p id="f-note" class="muted small" hidden></p>
          <label for="f-message">Status update <span class="muted">(shown to the reporter)</span></label>
          <textarea id="f-message" rows="4" maxlength="500"></textarea>
          <div class="counter muted small"><span id="f-count">0</span> / 500</div>
          <p id="f-error" class="form-error" role="alert" hidden></p>
          <button class="btn btn-primary" id="f-save" type="submit">Save update</button>
        </form>
      </div>
    </aside>

    <div id="toasts" class="toasts" aria-live="polite"></div>
  </div>

</body>
</html>
